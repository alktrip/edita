# Edita como Flatpak (fase 106): que el manifiesto de packaging/flatpak siga compilando con el
# runtime de KDE de Flathub, que pase el linter de Flathub y un paquete .flatpak para probarlo
name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Los dos permisos que Flathub concede como excepción al revisar la aplicación (justificados en
      # packaging/flatpak/README.md); cualquier otro problema hace fallar la CI
      - name: Linter de Flathub (manifiesto)
        run: flatpak-builder-lint --user-exceptions packaging/flatpak/lint-exceptions.json manifest packaging/flatpak/io.github.alktrip.Edita.yml
      - name: Compilar
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: packaging/flatpak/io.github.alktrip.Edita.yml
          bundle: Edita-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
