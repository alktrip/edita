# Edita para Linux: compila con -Werror, pasa todas las pruebas y genera el AppImage y el
# paquete .deb (con el mismo AppDir).
# Ubuntu 22.04 con GCC 12 y Qt 6.8.3, la misma base que el AppImage (glibc 2.35).
# Se lanza al subir a main (y deja el AppImage en el release «continuous»), en los pull
# requests, con etiquetas v* (y entonces lo publica en su release) o a mano. Si una prueba
# falla, la corrida falla y no se empaqueta.
name: Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # para publicar el AppImage en la release de una etiqueta

env:
  QT_VERSION: '6.8.3'
  CC: gcc-12
  CXX: g++-12

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Paquetes
        run: |
          .github/scripts/apt-mirror.sh
          sudo apt-get update
          # Compilar: Ninja, libzip, OpenSSL (la firma del catálogo de plugins), Python (Python
          # Script), OpenGL y xkbcommon (Qt Gui).
          # Pruebas: git, patch y nm (recetas),
          # pdftotext (impresión)
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config g++-12 libhunspell-dev \
            libzip-dev zlib1g-dev libssl-dev python3-dev libgl-dev libegl-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev \
            git patch binutils poppler-utils

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEDITA_WERROR=ON

      - name: Compilar
        run: cmake --build build

      - name: Probar
        # git necesita una identidad para los repositorios de prueba
        run: |
          git config --global user.name "Edita CI"
          git config --global user.email "ci@example.invalid"
          ctest --test-dir build -j4 --output-on-failure --timeout 900

      - name: Resultados de las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-linux
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  appimage:
    needs: pruebas
    runs-on: ubuntu-22.04
    # Uno a la vez por rama: dos pushes seguidos no se pisan al publicar el release continuo
    concurrency:
      group: appimage-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Paquetes
        run: |
          .github/scripts/apt-mirror.sh
          sudo apt-get update
          # dpkg-dev: dpkg-shlibdeps calcula las dependencias del paquete .deb
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config g++-12 file dpkg-dev libhunspell-dev \
            libzip-dev zlib1g-dev libssl-dev python3-dev libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-cursor0 libwayland-egl1 libcups2

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat
          cache: true

      - name: AppImage
        env:
          WORK: ${{ github.workspace }}/build-appimage
          OUT: ${{ github.workspace }}/dist
        run: |
          # La acción de Qt deja otro Python antes en el PATH; Python Script se compila con
          # el del sistema, y su biblioteca estándar es la que va en el AppImage
          mkdir -p "$RUNNER_TEMP/python-sistema"
          ln -sf /usr/bin/python3 "$RUNNER_TEMP/python-sistema/python3"
          export PATH="$RUNNER_TEMP/python-sistema:$PATH"
          export QMAKE_BIN="$QT_ROOT_DIR/bin/qmake"
          export CMAKE_EXTRA="-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          packaging/appimage/build-appimage.sh

      - name: Subir el AppImage y el .deb
        uses: actions/upload-artifact@v4
        with:
          name: Edita-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      # El release «continuous» (prerelease) lleva siempre el AppImage (y el .deb) del último push a
      # main: lo usan la CI del catálogo de plugins (alktrip/edita-plugins) y quien quiera
      # probar la versión en desarrollo
      - name: Publicar en el release continuo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f continuous
          git push -f origin refs/tags/continuous
          if ! gh release view continuous >/dev/null 2>&1; then
            gh release create continuous --prerelease --title "Edita (versión en desarrollo)" \
              --notes "El AppImage del último cambio en main, generado por la CI. No es una versión estable."
          fi
          for asset in $(gh release view continuous --json assets -q '.assets[].name'); do
            gh release delete-asset continuous "$asset" -y
          done
          gh release upload continuous dist/*.AppImage dist/*.deb

      # Las notas de cada versión están en packaging/release-notes/<etiqueta>.md. Una beta
      # se publica como versión normal (la última): es la que hay que descargar para probar
      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Edita ${{ github.ref_name }}
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          make_latest: true
          files: |
            dist/*.AppImage
            dist/*.deb
