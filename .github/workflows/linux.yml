# Edita para Linux, en x86_64 y en arm64 (aarch64): compila con -Werror, pasa todas las pruebas
# y genera el AppImage y los paquetes .deb y .rpm (con el mismo AppDir). Después instala los
# paquetes en Fedora y en Debian y comprueba que Edita arranca.
# x86_64: Ubuntu 22.04 con GCC 12 y Qt 6.8.3 (glibc 2.35). arm64: Ubuntu 24.04 (glibc 2.39),
# porque el Qt oficial para arm64 necesita glibc 2.38.
# Se lanza al subir a main (y deja el AppImage en el release «continuous»), en los pull
# requests, con etiquetas v* (y entonces lo publica en su release) o a mano. Si una prueba
# falla, la corrida falla y no se empaqueta.
name: Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # para publicar el AppImage en la release de una etiqueta

env:
  QT_VERSION: '6.8.3'
  CC: gcc-12
  CXX: g++-12

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    name: pruebas (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Paquetes
        run: |
          .github/scripts/apt-mirror.sh
          sudo apt-get update
          # Compilar: Ninja, libzip, OpenSSL (la firma del catálogo de plugins), Python (Python
          # Script), OpenGL y xkbcommon (Qt Gui).
          # Pruebas: git, patch y nm (recetas),
          # pdftotext (impresión)
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config g++-12 libhunspell-dev \
            libzip-dev zlib1g-dev libssl-dev python3-dev libgl-dev libegl-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev \
            git patch binutils poppler-utils

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEDITA_WERROR=ON

      - name: Compilar
        run: cmake --build build

      - name: Probar
        # git necesita una identidad para los repositorios de prueba
        run: |
          git config --global user.name "Edita CI"
          git config --global user.email "ci@example.invalid"
          ctest --test-dir build -j4 --output-on-failure --timeout 900

      - name: Resultados de las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-linux-${{ matrix.arch }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # Las mismas pruebas con AddressSanitizer y UndefinedBehaviorSanitizer (fase 93): accesos
  # fuera de memoria, usos después de liberar y comportamiento indefinido de C++, que en una
  # compilación normal pueden pasar sin que se note. Solo en x86_64 (es el mismo código).
  # Sin LeakSanitizer: Qt y fontconfig dejan memoria reservada a propósito al salir.
  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Paquetes
        run: |
          .github/scripts/apt-mirror.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config g++-12 libhunspell-dev \
            libzip-dev zlib1g-dev libssl-dev python3-dev libgl-dev libegl-dev libxkbcommon-dev \
            libfontconfig1-dev libfreetype-dev \
            git patch binutils poppler-utils

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEDITA_WERROR=ON -DEDITA_SANITIZE=address,undefined

      - name: Compilar
        run: cmake --build build

      - name: Probar
        # Un error detiene la prueba con su traza (halt_on_error). tst_perf y tst_crashreport no
        # se ejecutan con sanitizers (tests/CMakeLists.txt)
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_stack_use_after_return=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          git config --global user.name "Edita CI"
          git config --global user.email "ci@example.invalid"
          ctest --test-dir build -j4 --output-on-failure --timeout 1800

      - name: Resultados de las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-linux-sanitizers
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  appimage:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    name: paquetes (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Paquetes
        run: |
          .github/scripts/apt-mirror.sh
          sudo apt-get update
          # dpkg-dev: dpkg-shlibdeps calcula las dependencias del paquete .deb; rpm: rpmbuild
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config g++-12 file dpkg-dev rpm libhunspell-dev \
            libzip-dev zlib1g-dev libssl-dev python3-dev libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-cursor0 libwayland-egl1 libcups2

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      - name: AppImage
        env:
          WORK: ${{ github.workspace }}/build-appimage
          OUT: ${{ github.workspace }}/dist
        run: |
          # La acción de Qt deja otro Python antes en el PATH; Python Script se compila con
          # el del sistema, y su biblioteca estándar es la que va en el AppImage
          mkdir -p "$RUNNER_TEMP/python-sistema"
          ln -sf /usr/bin/python3 "$RUNNER_TEMP/python-sistema/python3"
          export PATH="$RUNNER_TEMP/python-sistema:$PATH"
          export QMAKE_BIN="$QT_ROOT_DIR/bin/qmake"
          export CMAKE_EXTRA="-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          packaging/appimage/build-appimage.sh

      - name: El AppImage arranca
        run: |
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen dist/*.AppImage --version)
          echo "$out"
          [[ $out == edita* ]]

      - name: Subir los paquetes
        uses: actions/upload-artifact@v4
        with:
          name: Edita-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Los paquetes, instalados como los instalaría un usuario (con las dependencias que piden) en
  # sistemas limpios de cada familia, y Edita arranca
  instalar:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-22.04, system: 'fedora:41'}
          - {arch: x86_64, runner: ubuntu-22.04, system: 'debian:12'}
          # arm64 se compila en Ubuntu 24.04 (glibc 2.39): Debian 13 es el primero que sirve
          - {arch: aarch64, runner: ubuntu-24.04-arm, system: 'fedora:41'}
          - {arch: aarch64, runner: ubuntu-24.04-arm, system: 'debian:13'}
    name: instalar (${{ matrix.system }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.system }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Edita-linux-${{ matrix.arch }}
          path: dist

      - name: Instalar
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y dist/*.rpm
          else
            apt-get update
            apt-get install -y ./dist/*.deb
          fi

      - name: Edita arranca
        run: |
          out=$(QT_QPA_PLATFORM=offscreen edita --version)
          echo "$out"
          case $out in edita*) ;; *) exit 1 ;; esac
          test -f /usr/share/applications/edita.desktop

  # Lo que se publica: los paquetes de las dos arquitecturas, una vez instalados bien
  publicar:
    needs: [appimage, instalar, sanitizers]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    # Uno a la vez por rama: dos pushes seguidos no se pisan al publicar el release continuo
    concurrency:
      group: publicar-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Edita-linux-*
          path: dist
          merge-multiple: true

      # El release «continuous» (prerelease) lleva siempre el AppImage (y el .deb) del último push a
      # main: lo usan la CI del catálogo de plugins (alktrip/edita-plugins) y quien quiera
      # probar la versión en desarrollo
      - name: Publicar en el release continuo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f continuous
          git push -f origin refs/tags/continuous
          if ! gh release view continuous >/dev/null 2>&1; then
            gh release create continuous --prerelease --title "Edita (versión en desarrollo)" \
              --notes "El AppImage del último cambio en main, generado por la CI. No es una versión estable."
          fi
          for asset in $(gh release view continuous --json assets -q '.assets[].name'); do
            gh release delete-asset continuous "$asset" -y
          done
          gh release upload continuous dist/*.AppImage dist/*.deb dist/*.rpm

      # Las notas de cada versión están en packaging/release-notes/<etiqueta>.md. Una beta
      # se publica como versión normal (la última): es la que hay que descargar para probar
      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Edita ${{ github.ref_name }}
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          make_latest: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
